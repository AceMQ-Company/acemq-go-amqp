# Verify a tag before it becomes a release.
#
# Go publishes by tag: there is no artifact to upload, and pkg.go.dev and the
# module proxy pick a version up on their own. That makes a tag irreversible in
# practice — the proxy caches it for ever — so the checks that matter have to
# run before anybody depends on it, and this fails loudly rather than leaving a
# broken version resolvable.
#
# Before pushing a tag, run ./scripts/release-preflight.sh <version>. Every
# check below also runs there, where a failure costs nothing. A failure here
# costs a version: the proxy caches a tag for ever, so a release that fails its
# own checks cannot be corrected in place -- 0.1.1, 0.1.2 and 0.1.3 were each
# spent finding out what the preflight now says in five seconds.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The version the module claims to support, not the newest. Releasing
          # something that only builds on a newer toolchain would break the
          # promise the API design rests on.
          go-version: '1.23'

      - name: Check the tag is a 0.1.x version
        # The line stays on 0.1.x until that is deliberately changed. Without
        # this a mistyped tag becomes a version nobody can withdraw.
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            0.1.*) echo "releasing $version" ;;
            *)
              echo "::error::this library releases 0.1.x only; '$version' needs the guard in release.yml lifted first"
              exit 1
              ;;
          esac

      - name: Check the module targets the Go it claims
        run: |
          declared=$(grep -E "^go [0-9]" go.mod | awk '{print $2}')
          if [ "$declared" != "1.23" ]; then
            echo "::error::go.mod says go $declared; this module targets 1.23"
            exit 1
          fi

      - name: Check the version constant matches the tag
        # A released library that reports "dev" tells an operator nothing about
        # what is running.
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(grep -oE 'Version = "[^"]+"' amqp/interceptors.go | cut -d'"' -f2)
          if [ "$declared" != "$version" ]; then
            echo "::error::the tag is $version but acemq.Version is \"$declared\""
            exit 1
          fi
          echo "acemq.Version is $declared"

      - name: Build, vet and test
        run: |
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - name: Build every codec module
        # Each is a module of its own, so nothing in the root build covers
        # them. A release that leaves one broken is a release nobody can use
        # that format from.
        run: |
          for module in codec/yaml codec/toml codec/protobuf codec/avro; do
            echo "--- $module"
            (cd "$module" && go build ./... && go vet ./...)
          done

      - name: Check every nested module has been tagged
        # A nested module is published by its own path-prefixed tag; the root
        # tag does not carry it. Without these, `go get .../codec/yaml@v0.1.0`
        # fails with "module found, but does not contain package", which reads
        # like the package is missing from the release rather than like a tag
        # nobody pushed. 0.1.0 shipped without them.
        #
        # Asked of the remote rather than the checkout. The release checkout is
        # shallow and carries the tag being released and nothing else, so a
        # local rev-parse reports every nested tag as missing however carefully
        # they were pushed -- and `git fetch --tags` failing under `bash -e`
        # took the step down before it could say so. 0.1.2 failed here with the
        # tags all present and the release itself perfectly good.
        run: |
          version="${GITHUB_REF_NAME}"
          tags="$(git ls-remote --tags origin | sed -e 's#.*refs/tags/##' -e 's#\^{}$##')"
          missing=""
          for module in codec/yaml codec/toml codec/protobuf codec/avro; do
            if ! printf '%s\n' "$tags" | grep -qx "$module/$version"; then
              missing="$missing $module/$version"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::these module tags are missing, so those formats cannot be consumed:$missing"
            echo "Tag them at this commit and push:"
            for tag in $missing; do
              echo "  git tag -a $tag $version^{} -m '...'"
            done
            exit 1
          fi
          echo "every nested module is tagged"

      - name: Check the codec modules require a released parent
        # A replace directive is ignored by anyone importing the module, so a
        # codec whose go.mod points at ../.. resolves the parent by its require
        # version. That version has to exist, or `go get` on the codec fails
        # with something that reads like a proxy problem.
        run: |
          version="${GITHUB_REF_NAME#v}"
          failed=0
          for module in codec/yaml codec/toml codec/protobuf codec/avro patterns/sqltest; do
            required=$(grep -oE 'github.com/AceMQ-Company/acemq-go-amqp v[0-9][^ ]*' "$module/go.mod" | awk '{print $2}')
            if [ "$required" != "v$version" ]; then
              echo "::error::$module requires the parent at $required; the tag is v$version"
              failed=1
            fi
          done
          test "$failed" -eq 0

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate development certificates
        run: go run ./cmd/acemq-certs --out "$RUNNER_TEMP/certs" --broker localhost --days 1

      - name: Start a broker serving them
        run: |
          chmod 644 "$RUNNER_TEMP"/certs/*.key
          docker run -d --name acemq-tls \
            -e HOME=/tmp \
            -p 5671:5671 -p 5672:5672 \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            -v "$RUNNER_TEMP/certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro" \
            rabbitmq:4-alpine
          # --since bounds this to the current boot. A restarted container
          # still carries the previous boot's startup line, and without the
          # bound the check passes against a broker that is not up.
          started=$(date -u +%Y-%m-%dT%H:%M:%S)
          for i in $(seq 1 60); do
            if docker logs --since "$started" acemq-tls 2>&1 | grep -q "Server startup complete"; then
              echo "the broker is up"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the broker never became ready"
          docker logs acemq-tls
          exit 1

      - name: Test against it
        # Run once, and judge that run. Running it twice races the restart the
        # recovery test performs — the same mistake ci.yml made and this file
        # inherited, which is why a good release failed its own integration job.
        env:
          ACEMQ_TEST_AMQPS_URL: amqps://guest:guest@localhost:5671/
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
          ACEMQ_TEST_CA: ${{ runner.temp }}/certs/ca.crt
          ACEMQ_TEST_RESTARTABLE_CONTAINER: acemq-tls
          ACEMQ_TEST_RESTARTABLE_URL: amqp://guest:guest@localhost:5672/
        run: |
          set -o pipefail
          go test -race -count=1 -v ./rabbitmq/ 2>&1 | tee "$RUNNER_TEMP/broker-tests.log"

      - name: Check nothing skipped
        run: |
          log="$RUNNER_TEMP/broker-tests.log"
          if grep -q -- "--- SKIP" "$log"; then
            echo "::error::a broker test skipped during a release"
            grep -- "--- SKIP" "$log"
            exit 1
          fi
          passed=$(grep -c -- "--- PASS" "$log" || true)
          if [ "$passed" -lt 23 ]; then
            echo "::error::only $passed broker tests passed; expected at least 23"
            exit 1
          fi
          echo "$passed broker tests passed"

  notify:
    needs: [verify, integration]
    if: always()
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: >-
        ${{ (needs.verify.result == 'success' && needs.integration.result == 'success')
            && 'success' || 'failure' }}
      # Not "FAILED". Go publishes by tag, so by the time this runs the version
      # is already on the module proxy and consumers can resolve it — the
      # release is out. What failed is the checking, and calling that a failed
      # release sends somebody looking for a broken artifact that does not
      # exist. The Java and .NET libraries word it the same way.
      title: >-
        ${{ (needs.verify.result == 'success' && needs.integration.result == 'success')
            && format('AceMQ for Go {0} released', github.ref_name)
            || format('AceMQ for Go {0} is published but the release did not finish', github.ref_name) }}
      message: >-
        ${{ (needs.verify.result == 'success' && needs.integration.result == 'success')
            && 'The module is on the proxy and pkg.go.dev. Consumers need nothing but go get.'
            || 'The tag is pushed and the proxy may already be serving it, so consumers can resolve this version, but a check did not pass. A Go tag cannot be withdrawn once cached — review the run before announcing it.' }}
      # Roadworks rather than a red dot for the half-finished case: the release
      # is usable and unfinished, which is a different thing from broken and
      # reads differently at a glance.
      #
      # Both branches name an emoji. Leaving the success branch empty to fall
      # back on the status-derived tick does not work: in GitHub's expression
      # language `a && '' || b` yields b, because an empty string is falsy, so
      # every successful release would be announced with roadworks.
      icon: >-
        ${{ (needs.verify.result == 'success' && needs.integration.result == 'success')
            && ':white_check_mark:' || ':construction:' }}
      url: https://pkg.go.dev/github.com/AceMQ-Company/acemq-go-amqp/amqp
    secrets:
      SLACK_DELIVERY_WEBHOOK: ${{ secrets.SLACK_DELIVERY_WEBHOOK }}
