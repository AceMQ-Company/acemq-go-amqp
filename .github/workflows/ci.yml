name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The oldest toolchain the module claims to support. Building with it
          # is what keeps that claim true: a newer one would happily compile a
          # generic method and nobody would notice until somebody on 1.23 tried.
          go-version: '1.23'

      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Check the library still builds on the Go it claims
        # The nested module must not drag the parent's floor up with it. This
        # already happened once: go mod tidy took the root to 1.25 and silently
        # broke the promise the whole API design rests on.
        run: |
          declared=$(grep -E "^go [0-9]" go.mod | awk '{print $2}')
          if [ "$declared" != "1.23" ]; then
            echo "::error::go.mod says go $declared; this module targets 1.23"
            exit 1
          fi
          echo "go.mod still targets $declared"

      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go mod tidy changed go.mod or go.sum; commit the result"
            git diff go.mod go.sum
            exit 1
          fi

  newest-toolchain:
    # The module targets 1.23, but it should not be broken by the current
    # release either. Failing here means something the newest toolchain
    # disallows, not something the oldest cannot do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

      - name: Build and test every optional module
        # Each is a module of its own, so nothing in the root build covers
        # them. A codec left broken is a format nobody can use, and a broken
        # telemetry/otel is a service that cannot be traced.
        run: |
          for module in codec/yaml codec/toml codec/protobuf codec/avro telemetry/otel; do
            echo "--- $module"
            (cd "$module" && go build ./... && go vet ./... && go test -count=1 ./...)
          done

      - name: Test the database-backed stores
        # A module of its own, and only this job can build it: the pure-Go
        # SQLite driver needs a newer Go than the library targets, and raising
        # the library's floor to test three files would cost every user of it
        # the thing that floor is there for.
        run: |
          cd patterns/sqltest
          go test -race -count=1 ./...

  integration:
    # One broker, both listeners, the whole transport suite.
    #
    # This was two jobs: a service container for plaintext and this one for TLS.
    # That left the TLS tests skipping in the plaintext job, which the skip
    # guard rightly failed on — a job that cannot run half its tests should not
    # be pretending to. The certificates cannot come from a service container
    # either, because they do not exist until a step has generated them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate development certificates
        run: go run ./cmd/acemq-certs --out "$RUNNER_TEMP/certs" --broker localhost --days 1

      - name: Start a broker serving them
        run: |
          # Readable by the broker's user inside the container, which is not
          # the user that generated them.
          chmod 644 "$RUNNER_TEMP"/certs/*.key
          docker run -d --name acemq-tls \
            -e HOME=/tmp \
            -p 5671:5671 -p 5672:5672 \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            -v "$RUNNER_TEMP/certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro" \
            rabbitmq:4-alpine
          # The broker's own word for it, from this boot only.
          #
          # A TCP connect is not enough: Docker publishes the port as soon as
          # the container starts, so a connection succeeds — and is then reset —
          # for several seconds before RabbitMQ is listening. That produced a
          # run where every test failed with "connection reset by peer" against
          # a broker the job had just called ready.
          #
          # rabbitmq-diagnostics is no good either: it needs the Erlang cookie
          # and cannot authenticate to its own node here, so it reports a CLI
          # problem as a broker problem.
          #
          # --since bounds it to this boot. Without that, a container that has
          # been restarted still has the previous boot's startup line in its
          # log and the check passes immediately against a broker that is not
          # up yet.
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for i in $(seq 1 60); do
            if docker logs --since "$started" acemq-tls 2>&1 | grep -q "Server startup complete"; then
              echo "the broker is up"
              docker logs --since "$started" acemq-tls 2>&1 | grep -E "started (TCP|TLS) listener"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the broker never became ready"
          docker logs acemq-tls
          exit 1

      - name: Test over TLS and plaintext together
        # Run once, and judge that run. It used to run twice — once for the
        # result and once to count skips — which broke as soon as a test
        # restarted the broker: the second run raced the restart and every test
        # after it failed to connect.
        env:
          ACEMQ_TEST_AMQPS_URL: amqps://guest:guest@localhost:5671/
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
          ACEMQ_TEST_CA: ${{ runner.temp }}/certs/ca.crt
          # The recovery test restarts this container, which is why it needs a
          # broker of its own rather than a shared one.
          ACEMQ_TEST_RESTARTABLE_CONTAINER: acemq-tls
          ACEMQ_TEST_RESTARTABLE_URL: amqp://guest:guest@localhost:5672/
          # The broker's own CLI, as a command prefix. The blocked-connection
          # tests drop the memory high watermark with it until RabbitMQ raises
          # an alarm and really blocks a connection; nothing else can produce
          # one, and a health check that has never met a blocked broker has
          # never been tested. They fail rather than skip when this is unset.
          #
          # HOME is the server's rather than the container's: the node wrote its
          # Erlang cookie to /var/lib/rabbitmq, and rabbitmqctl started with the
          # container's HOME=/tmp reads a different one and cannot authenticate
          # to the node beside it.
          ACEMQ_TEST_RABBITMQCTL: docker exec -e HOME=/var/lib/rabbitmq acemq-tls rabbitmqctl
        run: |
          set -o pipefail
          go test -race -count=1 -v ./rabbitmq/ 2>&1 | tee "$RUNNER_TEMP/broker-tests.log"

      - name: Check nothing skipped
        # Every broker test skips when its variables are unset, and a skip reads
        # as success. Without this, losing one would silently stop testing
        # against a broker at all.
        run: |
          log="$RUNNER_TEMP/broker-tests.log"
          if grep -q -- "--- SKIP" "$log"; then
            echo "::error::a broker test skipped while a broker was running"
            grep -- "--- SKIP" "$log"
            exit 1
          fi
          passed=$(grep -c -- "--- PASS" "$log" || true)
          if [ "$passed" -lt 25 ]; then
            echo "::error::only $passed broker tests passed; expected at least 25"
            exit 1
          fi
          echo "$passed broker tests passed"

      - name: What the broker said, if anything went wrong
        if: failure()
        run: docker logs acemq-tls

  compatibility:
    # The same suite against RabbitMQ 3.13, which is the version most production
    # estates are actually on. The integration job above runs 4.x and nothing
    # else, so "works on 3.13" was a claim with nothing behind it: every green
    # run only ever proved 4.x.
    #
    # A job of its own rather than another dimension on an existing matrix. The
    # two matrices this repository already has are about the Go toolchain — the
    # oldest one the module supports and the newest release — and a toolchain is
    # a compile-time question. A broker version is a runtime one. Crossing them
    # would start four containers to re-prove twice over what one run shows,
    # and a failure in the crossed job would not say which axis broke it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate development certificates
        # This job runs the TLS tests too, and therefore needs the same
        # certificate dance as the job above rather than a service container.
        #
        # Running them is the point rather than an extra: 3.13 is a different
        # Erlang/OTP release from 4.x, so it is a different TLS implementation
        # underneath, with its own defaults for protocol versions and peer
        # verification. That is precisely where a broker-version difference
        # would show up, and it is the half of the transport a plaintext-only
        # compatibility job would leave unproven. Skipping them would also trip
        # the skip guard below, which is the guard doing its job.
        run: go run ./cmd/acemq-certs --out "$RUNNER_TEMP/certs" --broker localhost --days 1

      - name: Start a 3.13 broker serving them
        run: |
          # Readable by the broker's user inside the container, which is not
          # the user that generated them.
          chmod 644 "$RUNNER_TEMP"/certs/*.key
          # The alpine image rather than -management: the 4.x job above runs
          # alpine, and the one thing this job should be changing is the
          # broker version. Nothing here talks to the management API.
          docker run -d --name acemq-tls-313 \
            -e HOME=/tmp \
            -p 5671:5671 -p 5672:5672 \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            -v "$RUNNER_TEMP/certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro" \
            rabbitmq:3.13-alpine
          # The broker's own word for it, from this boot only — the same check
          # as the 4.x job, and for the same reasons. A TCP connect succeeds
          # against a published port seconds before RabbitMQ is listening on
          # it, rabbitmq-diagnostics cannot authenticate to its own node here,
          # and without --since a restarted container matches the previous
          # boot's line immediately. 3.13 prints the same sentence, so none of
          # that needed weakening for the older broker.
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for i in $(seq 1 60); do
            if docker logs --since "$started" acemq-tls-313 2>&1 | grep -q "Server startup complete"; then
              echo "the broker is up"
              docker logs --since "$started" acemq-tls-313 2>&1 | grep -E "started (TCP|TLS) listener"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the broker never became ready"
          docker logs acemq-tls-313
          exit 1

      - name: Test over TLS and plaintext together
        # Once, and judge that run — running it twice raced the recovery test's
        # broker restart, and a 3.13 restart is no faster than a 4.x one.
        env:
          ACEMQ_TEST_AMQPS_URL: amqps://guest:guest@localhost:5671/
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
          ACEMQ_TEST_CA: ${{ runner.temp }}/certs/ca.crt
          ACEMQ_TEST_RESTARTABLE_CONTAINER: acemq-tls-313
          ACEMQ_TEST_RESTARTABLE_URL: amqp://guest:guest@localhost:5672/
          # HOME is the server's rather than the container's, exactly as in the
          # 4.x job: the node wrote its Erlang cookie to /var/lib/rabbitmq, and
          # rabbitmqctl started with the container's HOME=/tmp reads a
          # different one and is rejected by the node beside it with "Invalid
          # challenge reply". The blocked-connection tests fail rather than
          # skip when this is unset, so getting it wrong here would read as a
          # 3.13 incompatibility rather than the cookie mistake it is.
          ACEMQ_TEST_RABBITMQCTL: docker exec -e HOME=/var/lib/rabbitmq acemq-tls-313 rabbitmqctl
        run: |
          set -o pipefail
          go test -race -count=1 -v ./rabbitmq/ 2>&1 | tee "$RUNNER_TEMP/broker-tests.log"

      - name: Check nothing skipped
        # The same guard as the 4.x job, and it carries more weight here: this
        # job exists only to prove the suite passes against 3.13, so a test
        # that quietly stopped running would leave the whole claim resting on
        # nothing.
        #
        # The same floor as 4.x, deliberately. The two brokers run the identical
        # set of tests — 52 pass on each, none skip on either, TLS and streams
        # and the blocked-connection tests included — so there is nothing about
        # 3.13 that earns a lower bar. Lowering it to fit would be the guard
        # conceding a regression instead of reporting one; if 3.13 ever stops
        # running a test, this should fail and say so.
        run: |
          log="$RUNNER_TEMP/broker-tests.log"
          if grep -q -- "--- SKIP" "$log"; then
            echo "::error::a broker test skipped while a 3.13 broker was running"
            grep -- "--- SKIP" "$log"
            exit 1
          fi
          passed=$(grep -c -- "--- PASS" "$log" || true)
          if [ "$passed" -lt 25 ]; then
            echo "::error::only $passed broker tests passed on 3.13; expected at least 25"
            exit 1
          fi
          echo "$passed broker tests passed against RabbitMQ 3.13"

      - name: What the broker said, if anything went wrong
        if: failure()
        run: docker logs acemq-tls-313

  badge-matches-the-release:
    name: the README badge names the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the version badge against the newest release tag
        # A README badge is the first thing a reader sees and nothing keeps it
        # in step. This one said 0.1.4 while the library was at 0.7.0 -- six
        # minor versions, sitting at the top of the page, wrong since 0.1.4 was
        # the truth. acemq-java-amqp stays correct only because its release
        # rewrites the documented version; every other repository updates the
        # badge by hand, which means sometimes.
        #
        # Tags come from ls-remote so this needs no token on a scheduled run.
        # Only plain vX.Y.Z tags count: Go publishes nested modules as
        # codec/avro/vX.Y.Z, and those are not the repository's version.
        run: |
          newest=$(git ls-remote --tags origin \
            | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          badge=$(grep -oE 'badge/version-[0-9][0-9.]*' README.md | head -1 | sed 's|badge/version-||')

          if [ -z "$newest" ]; then
            echo "no release tags yet, so there is nothing for the badge to disagree with"
            exit 0
          fi
          if [ -z "$badge" ]; then
            echo "::error::no version badge found in README.md, so this check cannot do its job"
            exit 1
          fi
          # Behind is the failure; ahead is a release being prepared.
          #
          # The badge is bumped in the commit that readies a release, which is
          # pushed before the tag exists -- so for a few minutes the badge names
          # a version no tag does. Failing on any difference would redden that
          # commit and block the release it is part of, which is the check
          # sabotaging the thing it is meant to protect. Only a badge older than
          # the newest release is wrong.
          older=$(printf '%s\n%s\n' "$badge" "$newest" | sort -V | head -1)
          if [ "$badge" != "$newest" ] && [ "$older" = "$badge" ]; then
            echo "::error::the README badge says $badge but the newest release is $newest."
            echo "::error::Edit the version badge in README.md and set it to $newest."
            exit 1
          fi
          if [ "$badge" != "$newest" ]; then
            echo "the badge says $badge and the newest release is $newest; a release looks to be in flight"
            exit 0
          fi
          echo "the badge says $badge, which is the newest release"
