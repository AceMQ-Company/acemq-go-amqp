name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The oldest toolchain the module claims to support. Building with it
          # is what keeps that claim true: a newer one would happily compile a
          # generic method and nobody would notice until somebody on 1.23 tried.
          go-version: '1.23'

      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Check the library still builds on the Go it claims
        # The nested module must not drag the parent's floor up with it. This
        # already happened once: go mod tidy took the root to 1.25 and silently
        # broke the promise the whole API design rests on.
        run: |
          declared=$(grep -E "^go [0-9]" go.mod | awk '{print $2}')
          if [ "$declared" != "1.23" ]; then
            echo "::error::go.mod says go $declared; this module targets 1.23"
            exit 1
          fi
          echo "go.mod still targets $declared"

      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go mod tidy changed go.mod or go.sum; commit the result"
            git diff go.mod go.sum
            exit 1
          fi

  newest-toolchain:
    # The module targets 1.23, but it should not be broken by the current
    # release either. Failing here means something the newest toolchain
    # disallows, not something the oldest cannot do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

      - name: Build and test every codec module
        # Each is a module of its own, so nothing in the root build covers
        # them. A codec left broken is a format nobody can use.
        run: |
          for module in codec/yaml codec/toml codec/protobuf codec/avro; do
            echo "--- $module"
            (cd "$module" && go build ./... && go vet ./... && go test -count=1 ./...)
          done

      - name: Test the database-backed stores
        # A module of its own, and only this job can build it: the pure-Go
        # SQLite driver needs a newer Go than the library targets, and raising
        # the library's floor to test three files would cost every user of it
        # the thing that floor is there for.
        run: |
          cd patterns/sqltest
          go test -race -count=1 ./...

  integration:
    # One broker, both listeners, the whole transport suite.
    #
    # This was two jobs: a service container for plaintext and this one for TLS.
    # That left the TLS tests skipping in the plaintext job, which the skip
    # guard rightly failed on — a job that cannot run half its tests should not
    # be pretending to. The certificates cannot come from a service container
    # either, because they do not exist until a step has generated them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate development certificates
        run: go run ./cmd/acemq-certs --out "$RUNNER_TEMP/certs" --broker localhost --days 1

      - name: Start a broker serving them
        run: |
          # Readable by the broker's user inside the container, which is not
          # the user that generated them.
          chmod 644 "$RUNNER_TEMP"/certs/*.key
          docker run -d --name acemq-tls \
            -e HOME=/tmp \
            -p 5671:5671 -p 5672:5672 \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            -v "$RUNNER_TEMP/certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro" \
            rabbitmq:4-alpine
          # The broker's own word for it, from this boot only.
          #
          # A TCP connect is not enough: Docker publishes the port as soon as
          # the container starts, so a connection succeeds — and is then reset —
          # for several seconds before RabbitMQ is listening. That produced a
          # run where every test failed with "connection reset by peer" against
          # a broker the job had just called ready.
          #
          # rabbitmq-diagnostics is no good either: it needs the Erlang cookie
          # and cannot authenticate to its own node here, so it reports a CLI
          # problem as a broker problem.
          #
          # --since bounds it to this boot. Without that, a container that has
          # been restarted still has the previous boot's startup line in its
          # log and the check passes immediately against a broker that is not
          # up yet.
          started=$(date -u +%Y-%m-%dT%H:%M:%S)
          for i in $(seq 1 60); do
            if docker logs --since "$started" acemq-tls 2>&1 | grep -q "Server startup complete"; then
              echo "the broker is up"
              docker logs --since "$started" acemq-tls 2>&1 | grep -E "started (TCP|TLS) listener"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the broker never became ready"
          docker logs acemq-tls
          exit 1

      - name: Test over TLS and plaintext together
        # Run once, and judge that run. It used to run twice — once for the
        # result and once to count skips — which broke as soon as a test
        # restarted the broker: the second run raced the restart and every test
        # after it failed to connect.
        env:
          ACEMQ_TEST_AMQPS_URL: amqps://guest:guest@localhost:5671/
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
          ACEMQ_TEST_CA: ${{ runner.temp }}/certs/ca.crt
          # The recovery test restarts this container, which is why it needs a
          # broker of its own rather than a shared one.
          ACEMQ_TEST_RESTARTABLE_CONTAINER: acemq-tls
          ACEMQ_TEST_RESTARTABLE_URL: amqp://guest:guest@localhost:5672/
        run: |
          set -o pipefail
          go test -race -count=1 -v ./rabbitmq/ 2>&1 | tee "$RUNNER_TEMP/broker-tests.log"

      - name: Check nothing skipped
        # Every broker test skips when its variables are unset, and a skip reads
        # as success. Without this, losing one would silently stop testing
        # against a broker at all.
        run: |
          log="$RUNNER_TEMP/broker-tests.log"
          if grep -q -- "--- SKIP" "$log"; then
            echo "::error::a broker test skipped while a broker was running"
            grep -- "--- SKIP" "$log"
            exit 1
          fi
          passed=$(grep -c -- "--- PASS" "$log" || true)
          if [ "$passed" -lt 23 ]; then
            echo "::error::only $passed broker tests passed; expected at least 23"
            exit 1
          fi
          echo "$passed broker tests passed"

      - name: What the broker said, if anything went wrong
        if: failure()
        run: docker logs acemq-tls
